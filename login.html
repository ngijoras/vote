<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Login E-Vote — Sistem Pemilihan Elektronik" />

  <title>Masuk • E-Vote</title>

  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* =========================================
       LOGIN PAGE STYLES (HIGH CONTRAST FIX)
       ========================================= */
    body.landing {
      min-height: 100vh;
      display: grid;
      place-items: center;
      /* ✅ Background gradien gelap agar kartu putih menonjol */
      background: 
        radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15), transparent 40%),
        #e2e8f0 !important;
      padding: 24px;
    }

    .hero {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand img {
      max-height: 64px;
      margin: 0 auto 14px;
    }
    .brand h1 {
      font-size: 2rem;
      margin: 8px 0 4px;
      background: linear-gradient(135deg, #1e3a8a, #4c1d95) !important;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    .brand .subtitle {
      color: #475569 !important;
      margin: 0;
      font-size: .92rem;
      font-weight: 600;
    }

    /* Badge Sistem Aktif */
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #dcfce7 !important;
      color: #166534 !important;
      border: 1px solid #bbf7d0 !important;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
      margin-top: 8px;
      letter-spacing: .02em;
    }
    .brand-badge .dot-live {
      width: 6px; height: 6px;
      background: #16a34a;
      border-radius: 50%;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.75); }
    }

    /* Kartu Login */
    .login-card {
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 18px;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.15) !important;
      padding: 32px;
    }
    .login-card h2 {
      color: #0f172a !important;
      margin-top: 0;
      font-size: 1.5rem;
    }
    .login-card .hint {
      color: #475569 !important;
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 0;
    }

    /* Label & Input */
    .landing-extras {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }
    .landing-extras label > span {
      color: #1e293b !important;
      font-weight: 700 !important;
      font-size: 0.9rem !important;
      margin-bottom: 6px;
      display: block;
    }
    .input {
      background: #f8fafc !important;
      border: 1px solid #cbd5e1 !important;
      color: #0f172a !important;
      font-weight: 500;
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .input:focus {
      background: #ffffff !important;
      border-color: #2563eb !important;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15) !important;
      outline: none;
    }
    .input::placeholder {
      color: #94a3b8 !important;
      font-weight: 400;
    }

    /* Password Toggle */
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 44px;
    }
    .pwd-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px; height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #64748b !important;
      transition: .15s ease;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .pwd-toggle:hover {
      background: #e2e8f0 !important;
      color: #0f172a !important;
    }

    /* Remember Me */
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .85rem;
      color: #334155 !important;
      font-weight: 500;
      margin: 4px 0 0;
      user-select: none;
      cursor: pointer;
    }
    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    /* Tombol Masuk */
    .login-card .btn-primary {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font-size: .95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #1d4ed8, #4338ca) !important;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4) !important;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 10px;
      border: none;
      color: #fff;
      cursor: pointer;
      transition: .2s;
    }
    .login-card .btn-primary:hover {
      background: linear-gradient(135deg, #1e40af, #3730a3) !important;
      transform: translateY(-1px);
    }
    .login-card .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .login-card .btn-primary .spinner-inline {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Banner Error */
    .banner {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: .85rem;
      line-height: 1.4;
      display: none;
      margin-bottom: 4px;
      animation: slideIn .2s ease;
      font-weight: 600;
    }
    .banner.show { display: block; }
    .banner.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .banner.warn  { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .banner.info  { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .banner.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    .footer {
      text-align: center;
      color: #64748b !important;
      margin-top: 24px;
      font-size: .8rem;
      font-weight: 500;
    }
    .version-stamp {
      font-size: .7rem;
      color: #94a3b8 !important;
      margin-top: 6px;
    }

    /* Mobile */
    @media (max-width: 480px) {
      input, select, textarea {
        font-size: 16px !important; /* Anti-zoom iOS */
      }
      .login-card { padding: 24px; }
    }
  </style>
</head>
<body class="landing">
  <noscript>
    <div style="padding:24px;background:#fee2e2;color:#991b1b;text-align:center;font-family:sans-serif">
      <strong>JavaScript dinonaktifkan.</strong> Aktifkan JavaScript untuk login.
    </div>
  </noscript>

  <div class="hero">
    <div class="brand">
      <img src="assets/logo.svg" alt="Logo E-Vote" onerror="this.style.display='none'" style="max-height:64px" />
      <h1>E-Vote</h1>
      <p class="subtitle">Pemilihan Ketua RT &amp; Ketua/Wakil Pemuda</p>
      <span class="brand-badge"><span class="dot-live"></span> Sistem Aktif</span>
    </div>

    <form id="loginForm" class="card login-card" autocomplete="on" novalidate>
      <h2>Masuk ke Sistem</h2>
      <p class="hint" style="margin-top:0">Gunakan akun yang diberikan panitia.</p>

      <div id="loginBanner" class="banner" role="alert" aria-live="polite"></div>

      <div class="landing-extras">
        <label class="field">
          <span>Username</span>
          <input id="username" name="username" class="input" type="text"
                 placeholder="admin / petugas1 / bilik-1 / coklit1"
                 autocomplete="username" autocapitalize="off" autocorrect="off"
                 spellcheck="false" required />
        </label>

        <label class="field">
          <span>Password</span>
          <div class="password-wrap">
            <input id="password" name="password" class="input" type="password"
                   placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="pwd-toggle" id="pwdToggle"
                    aria-label="Tampilkan password" tabindex="-1">👁️</button>
          </div>
        </label>

        <label class="remember-row">
          <input type="checkbox" id="rememberUsername" /> Ingat username saya
        </label>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">Masuk</button>

      <p class="hint text-center" style="margin-top:14px">
        <a href="index.html" style="color:var(--primary);font-weight:600">← Kembali ke Halaman Utama</a>
      </p>
    </form>

    <div class="footer">
      © <span id="year">2025</span> Panitia Pemilihan • Sistem E-Vote
      <div class="version-stamp">v2.0 • Powered by Apps Script &amp; GitHub Pages</div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
  (function () {
    'use strict';

    const form       = document.getElementById('loginForm');
    const usernameI  = document.getElementById('username');
    const passwordI  = document.getElementById('password');
    const pwdToggle  = document.getElementById('pwdToggle');
    const loginBtn   = document.getElementById('loginBtn');
    const banner     = document.getElementById('loginBanner');
    const remember   = document.getElementById('rememberUsername');
    const yearEl     = document.getElementById('year');

    const LS_REMEMBER = 'evote_remember_username';
    const Store       = (window.SafeStorage || window.localStorage);

    if (yearEl) yearEl.textContent = new Date().getFullYear();

    let submitting = false;

    /* =========================================================
       BANNER HELPERS
       ========================================================= */
    function showBanner(msg, type) {
      if (!banner) return;
      banner.textContent = msg;
      banner.className = 'banner show ' + (type || 'error');
    }
    function clearBanner() {
      if (!banner) return;
      banner.textContent = '';
      banner.className = 'banner';
    }

    /* =========================================================
       LOADING STATE
       ========================================================= */
    function setLoading(isLoading) {
      submitting = isLoading;
      if (loginBtn) {
        loginBtn.disabled = isLoading;
        loginBtn.innerHTML = isLoading
          ? '<span class="spinner-inline"></span> Memproses…'
          : 'Masuk';
      }
      if (usernameI) usernameI.disabled = isLoading;
      if (passwordI) passwordI.disabled = isLoading;
      if (remember)  remember.disabled = isLoading;
    }

    /* =========================================================
       CONFIG GUARD
       ========================================================= */
    if (window.API && API.isConfigured && !API.isConfigured()) {
      showBanner('Backend belum dikonfigurasi. Buka js/api.js dan ganti BASE_URL.', 'warn');
    }

    /* =========================================================
       SESSION EXPIRED
       ========================================================= */
    try {
      const urlParams = new URLSearchParams(location.search);
      if (urlParams.get('expired') === '1') {
        showBanner('Sesi Anda telah berakhir. Silakan login ulang.', 'warn');
      }
    } catch (_) {}

    /* =========================================================
       AUTO-REDIRECT JIKA SUDAH LOGIN
       ========================================================= */
    try {
      if (window.Auth && Auth.isLoggedIn && Auth.isLoggedIn()) {
        if (Auth.homeForRole) {
          const target = Auth.homeForRole(Auth.role ? Auth.role() : '');
          location.replace('app.html' + (target.startsWith('#') ? target : ''));
        } else {
          location.replace('app.html');
        }
        return;
      }
    } catch (_) {}

    /* =========================================================
       RESTORE REMEMBERED USERNAME
       ========================================================= */
    try {
      let saved = '';
      if (window.Auth && Auth.rememberedUsername) {
        saved = Auth.rememberedUsername();
      } else {
        saved = Store.getItem(LS_REMEMBER) || '';
      }

      if (saved && usernameI) {
        usernameI.value = saved;
        if (remember) remember.checked = true;
        if (passwordI) passwordI.focus();
      } else if (usernameI) {
        usernameI.focus();
      }
    } catch (_) {}

    /* =========================================================
       PASSWORD TOGGLE
       ========================================================= */
    if (pwdToggle && passwordI) {
      pwdToggle.addEventListener('click', function () {
        const isPwd = passwordI.type === 'password';
        passwordI.type = isPwd ? 'text' : 'password';
        pwdToggle.textContent = isPwd ? '🙈' : '👁️';
        pwdToggle.setAttribute('aria-label', isPwd ? 'Sembunyikan password' : 'Tampilkan password');
        try { passwordI.focus(); } catch (_) {}
      });
    }

    /* =========================================================
       ROLE → REDIRECT TARGET
       ========================================================= */
    function roleRedirect(role) {
      switch (String(role || '').toLowerCase()) {
        case 'admin':   return 'app.html#/admin';
        case 'petugas': return 'app.html#/petugas';
        case 'bilik':   return 'app.html#/bilik';
        case 'coklit':  return 'app.html#/coklit';
        default:        return 'app.html';
      }
    }

    /* =========================================================
       SUBMIT HANDLER
       ========================================================= */
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (submitting) return;
      clearBanner();

      const username = (usernameI && usernameI.value || '').trim();
      const password = passwordI && passwordI.value || '';

      if (!username || !password) {
        showBanner('Username dan password wajib diisi.', 'error');
        return;
      }

      setLoading(true);

      let res;
      try {
        if (window.Auth && Auth.login) {
          res = await Auth.login(username, password);
        } else {
          res = await API.login(username, password);
        }
      } catch (err) {
        setLoading(false);
        showBanner('Kesalahan jaringan: ' + (err && err.message ? err.message : err), 'error');
        return;
      }

      if (!res || !res.success) {
        setLoading(false);
        showBanner((res && res.message) || 'Login gagal.', 'error');
        if (passwordI) { passwordI.focus(); passwordI.select(); }
        return;
      }

      /* Simpan sesi */
      try {
        if (res.token && res.user && window.Auth && Auth.setSession) {
          if (!Auth.isLoggedIn || !Auth.isLoggedIn()) {
            Auth.setSession(res.token, res.user);
          }
        } else if (res.token && res.user && API.setSession) {
          API.setSession(res.token, res.user);
        }
      } catch (_) {}

      /* Remember username */
      try {
        const shouldRemember = remember && remember.checked;
        if (window.Auth && Auth.saveRememberedUsername) {
          Auth.saveRememberedUsername(shouldRemember ? username : '');
        } else if (shouldRemember) {
          Store.setItem(LS_REMEMBER, username);
        } else {
          Store.removeItem(LS_REMEMBER);
        }
      } catch (_) {}

      /* Feedback UI */
      if (loginBtn) {
        loginBtn.innerHTML = '<span class="spinner-inline"></span> Berhasil…';
      }
      showBanner('Login berhasil. Mengalihkan…', 'success');

      /* Redirect berdasarkan role */
      const target = roleRedirect(res.user && res.user.role);
      setTimeout(function () { location.replace(target); }, 350);
    });

    /* =========================================================
       UX HELPERS
       ========================================================= */
    if (usernameI) {
      usernameI.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (passwordI) passwordI.focus();
        }
      });
    }

    [usernameI, passwordI].forEach(function (el) {
      if (el) el.addEventListener('input', clearBanner);
    });

    if (usernameI && passwordI && usernameI.value && !passwordI.value) {
      setTimeout(function () { try { passwordI.focus(); } catch (_) {} }, 100);
    }
  })();
  </script>
</body>
</html>
